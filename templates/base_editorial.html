<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Endonautas{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Autoconocimiento profundo e integración psicológica.{% endblock %}">
  <meta property="og:title" content="{% block og_title %}Endonautas{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Autoconocimiento profundo e integración psicológica.{% endblock %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:url" content="https://endonautas.cl{% block og_url %}{% endblock %}">
  <link rel="canonical" href="https://endonautas.cl{% block canonical %}{% endblock %}">

  {% block structured_data %}{% endblock %}

  <!-- EB Garamond + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #000000;
      --text:       #ffffff;
      --muted:      #a1a1aa;
      --dim:        #52525b;
      --gold:       #d4a853;
      --gold-glow:  rgba(212,168,83,0.18);
      --teal:       #4ecdc4;
      --glass-bg:   rgba(255,255,255,0.03);
      --glass-bd:   rgba(255,255,255,0.08);
      --glass-hov:  rgba(255,255,255,0.06);
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-ui:    'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; background: var(--bg); }

    body {
      background: transparent;
      color: var(--text);
      font-family: var(--font-ui);
      font-weight: 300;
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Fondo global fijo ── */
    #global-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--bg);
      overflow: hidden;
    }

    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      animation: aFloat 22s infinite alternate ease-in-out;
    }
    .aurora-1 {
      top: -15%; right: -10%;
      width: 700px; height: 700px;
      background: #3b0764;
      opacity: 0.45;
    }
    .aurora-2 {
      bottom: -20%; left: -15%;
      width: 900px; height: 900px;
      background: #172554;
      opacity: 0.3;
      animation-delay: -6s;
    }
    .aurora-3 {
      top: 40%; left: 30%;
      width: 500px; height: 500px;
      background: #0f2027;
      opacity: 0.35;
      animation-delay: -11s;
    }

    @keyframes aFloat {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(-40px, 50px) scale(1.12); }
    }

    /* ── Nav ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      pointer-events: none;
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.4rem 4rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
    }
    .nav > * { pointer-events: auto; }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .nav-logo em { font-style: italic; color: var(--muted); }

    .nav-links {
      display: flex; gap: 2rem; align-items: center; list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 400;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links .nav-cta {
      color: var(--teal);
      border: 1px solid rgba(78,205,196,0.3);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-weight: 500;
    }
    .nav-links .nav-cta:hover {
      background: rgba(78,205,196,0.08);
      color: var(--teal);
    }

    /* ── Contenido ── */
    #page-content {
      position: relative;
      z-index: 1;
    }

    /* ── Utilidades ── */
    .container      { max-width: 780px;  margin: 0 auto; padding: 0 1.5rem; }
    .container-wide { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

    .tag-label {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted);
    }
    .tag-label::before {
      content: ''; display: block; width: 24px; height: 1px; background: var(--dim);
    }

    .tag-pill {
      display: inline-block;
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold); border: 1px solid rgba(212,168,83,0.25);
      border-radius: 999px; padding: 0.2rem 0.7rem;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-bd);
      border-radius: 20px;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .glass-card:hover {
      background: var(--glass-hov);
      border-color: rgba(255,255,255,0.14);
      transform: translateY(-3px);
    }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: #fff; color: #000;
      font-family: var(--font-ui); font-weight: 500; font-size: 0.82rem;
      letter-spacing: 0.04em;
      padding: 0.85rem 2rem; border-radius: 999px; border: none;
      text-decoration: none; cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,255,255,0.1);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      background: #e4e4e7;
      transform: scale(1.02);
      box-shadow: 0 6px 24px rgba(255,255,255,0.15);
    }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: transparent; color: var(--text);
      font-family: var(--font-ui); font-size: 0.82rem; letter-spacing: 0.04em;
      padding: 0.85rem 2rem; border-radius: 999px;
      border: 1px solid var(--glass-bd);
      text-decoration: none; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-ghost:hover {
      background: var(--glass-hov);
      border-color: rgba(255,255,255,0.2);
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 0;
    }

    /* ── Footer ── */
    .footer {
      position: relative; z-index: 1;
      margin-top: 8rem;
      padding: 3rem 2rem;
      text-align: center;
      color: var(--dim);
      font-size: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .footer-links {
      display: flex; gap: 2rem; justify-content: center;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .footer-links a {
      color: var(--dim); text-decoration: none;
      font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--muted); }

    @media (max-width: 768px) {
      .nav { padding: 1rem 1.25rem; }
      .nav-links { gap: 1rem; }
      .nav-links a { font-size: 0.72rem; }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Fondo global con auroras -->
<div id="global-bg">
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <div class="aurora aurora-3"></div>
  <canvas id="star-canvas"></canvas>
</div>

<header>
  <nav class="nav" aria-label="Navegación principal">
    <a href="/" class="nav-logo">Endonautas <em>·</em></a>
    <ul class="nav-links">
      <li><a href="/blog/">Blog</a></li>
      <li><a href="https://ebook.endonautas.cl" target="_blank">Endonautica</a></li>
      <li><a href="https://app.endonautas.cl" class="nav-cta">Entrar a la App →</a></li>
    </ul>
  </nav>
</header>

<main id="page-content">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="/">Inicio</a>
    <a href="/blog/">Blog</a>
    <a href="https://ebook.endonautas.cl">Endonautica</a>
    <a href="https://app.endonautas.cl">App</a>
  </div>
  <p>© {% now "Y" %} Endonautas — Franco Jeria Castro</p>
</footer>

<script>
(function() {
  const canvas = document.getElementById('star-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for (let i = 0; i < 160; i++) {
    stars.push({
      x: Math.random() * 1920,
      y: Math.random() * 1080,
      r: Math.random() * 0.9 + 0.1,
      a: Math.random() * 0.7 + 0.1,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.twinkle += s.speed;
      const alpha = s.a * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(
        (s.x / 1920) * W,
        (s.y / 1080) * H,
        s.r, 0, Math.PI * 2
      );
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
