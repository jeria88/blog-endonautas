[deploy]
startCommand = "python manage.py prepare_db --settings=config.settings.production && python manage.py migrate --fake-initial --settings=config.settings.production && python manage.py seed_centro --settings=config.settings.production && python manage.py collectstatic --noinput --settings=config.settings.production && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"

[build]
builder = "NIXPACKS"
